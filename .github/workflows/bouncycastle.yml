name: bouncycastle

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_ROLL_FORWARD: Major

jobs:
  unit:
    name: build and unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Build FluentFTP.BouncyCastle for all targets
        run: dotnet build FluentFTP.BouncyCastle/FluentFTP.BouncyCastle.csproj -c Release -warnaserror
      - name: Build the test project
        run: dotnet build FluentFTP.Tests/FluentFTP.Tests.csproj -c Debug
      - name: Run the Bouncy Castle unit tests
        run: dotnet test FluentFTP.Tests/FluentFTP.Tests.csproj -c Debug --no-build --filter "FullyQualifiedName~Unit.BouncyCastle" --logger "trx;LogFileName=bouncycastle-unit.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bouncycastle-unit-${{ matrix.os }}
          path: FluentFTP.Tests/TestResults/*.trx

  integration:
    name: FTPS integration tests (vsftpd, proftpd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Build the vsftpd and proftpd images
        working-directory: FluentFTP.Dockers
        # Debian bullseye is archived: only its release and updates suites remain on the main mirror,
        # so the repository's mirror-selection helper is bypassed here.
        run: |
          printf 'deb http://deb.debian.org/debian bullseye main contrib non-free\ndeb http://deb.debian.org/debian bullseye-updates main contrib non-free\n' > sources.list
          for d in common-debian-slim vsftpd proftpd; do cp sources.list "$d/"; done
          docker build common-debian-slim -t common-debian-slim:fluentftp
          docker build vsftpd -t vsftpd:fluentftp
          docker build proftpd -t proftpd:fluentftp
      - name: Build the test project
        run: dotnet build FluentFTP.Tests/FluentFTP.Tests.csproj -c Debug
      - name: Run the Bouncy Castle FTPS integration tests
        # GitHub sets CI=true, which makes IntegrationTestRunner skip; these tests need Docker and must run here.
        env:
          CI: "false"
          FLUENTFTP_LOG_TO_CONSOLE: "true"
        run: dotnet test FluentFTP.Tests/FluentFTP.Tests.csproj -c Debug --no-build --filter "FullyQualifiedName~IntegrationTests_BouncyCastle" --logger "trx;LogFileName=bouncycastle-integration.trx" --logger "console;verbosity=normal"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bouncycastle-integration
          path: FluentFTP.Tests/TestResults/*.trx
